<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#203f55">
  <meta name="description" content="Vẽ sơ đồ kết cấu trên máy tính và tablet, lưu bản vẽ và xuất hình cho bài giảng.">
  <title>Kết cấu Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/app.js" defer></script>
  <script src="assets/tablet.js" defer></script>
  <script src="assets/calculator.js" defer></script>
</head>
<body>

<header><div><strong>Kết cấu Studio</strong><small>Vẽ sơ đồ · Soạn bài · Xuất hình</small></div><div class="header-actions"><button id="toggleTools" aria-expanded="true" aria-controls="toolPanel">Công cụ</button><button id="installApp" hidden>Cài ứng dụng</button></div></header><main><aside id="toolPanel" aria-label="Công cụ và thuộc tính"><h2>Công cụ</h2><div id="tools"></div><p id="help"></p><input type="hidden" id="label" value="P = 20 kN"><label>Gối tựa<select id="support"><option value="pin">Khớp cố định</option><option value="roller">Di động</option><option value="fixed">Ngàm</option></select></label><label>Chiều lực / hướng gối<select id="direction"><option value="down">Xuống</option><option value="up">Lên</option><option value="right">Phải</option><option value="left">Trái</option></select></label><label>Chiều mô men<select id="rotation"><option value="cw">Thuận kim đồng hồ</option><option value="ccw">Ngược kim đồng hồ</option></select></label></aside><article aria-label="Bản vẽ"><div id="actions"></div><div id="viewTools" role="toolbar" aria-label="Điều khiển vùng nhìn"></div><div class="canvas-wrap"><svg id="drawing" aria-label="Vùng vẽ kết cấu" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720"></svg></div><div id="status" role="status"></div><p>Chạm để vẽ hoặc chọn; dùng hai ngón để phóng to và di chuyển vùng nhìn. Chọn đối tượng rồi bấm Sửa nhãn. Lưu JSON để chuyển bản vẽ giữa máy tính và tablet.</p></article></main><input id="file" type="file" accept=".json">

<noscript>Vui lòng bật JavaScript để sử dụng công cụ vẽ.</noscript>
</body>
</html>
